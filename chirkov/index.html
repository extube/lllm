<!DOCTYPE html>
<html lang="ru">
<!--
  ════════════════════════════════════════════════════════════════════
  ЗАГОТОВКА ДЛЯ ХАКАТОНА (правила — TASK.md). Здесь намеренно минимум.

  Ваша работа за 30 минут:
    1) <style>              — пустой, добавьте свои стили (метка ниже);
    2) "LLM: ПРОМПТ"        — сейчас самая простая версия, напишите свою;
    3) "SAFETY: RED FLAGS"  — сейчас минимальный список, расширьте его;
    4) разметка вывода и UX — TODO-комментарии подскажут.

  Трогать не обязательно: блок "LLM: ПОДКЛЮЧЕНИЕ" уже рабочий.
  Работает с любым сервером-хакатоном на порту 8000 без настройки:
  сначала пробуется стандартный llama.cpp, затем стенд организаторов
  OVMS; если оба недоступны — показывается понятная ошибка. Ключи
  не требуются.
  ════════════════════════════════════════════════════════════════════
-->
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Профилактика — локальный LLM</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      max-width: 640px;
      margin: 32px auto;
      padding: 0 16px;
      line-height: 1.5;
      color: #1c1f26;
      background: #f6f7f9;
    }
    h1 { font-size: 1.5rem; margin-bottom: 1rem; }
    #banner {
      background: #fdecec;
      border: 1px solid #e3342f;
      color: #9b1c1c;
      font-weight: 600;
      padding: 14px 16px;
      border-radius: 8px;
      margin-bottom: 16px;
    }
    form {
      display: flex;
      flex-direction: column;
      gap: 12px;
      background: #fff;
      padding: 20px;
      border-radius: 10px;
      border: 1px solid #e2e5ea;
    }
    form label {
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 0.95rem;
      font-weight: 500;
    }
    form label:has(input[type="checkbox"]) {
      flex-direction: row;
      align-items: center;
      font-weight: 400;
    }
    input, select, textarea {
      font: inherit;
      padding: 8px 10px;
      border: 1px solid #c7ccd4;
      border-radius: 6px;
    }
    textarea { min-height: 80px; resize: vertical; }
    button {
      font: inherit;
      font-weight: 600;
      padding: 10px 16px;
      border: none;
      border-radius: 6px;
      background: #2563eb;
      color: #fff;
      cursor: pointer;
    }
    button:disabled { background: #93b4ee; cursor: wait; }
    #status { margin-top: 12px; color: #555; font-style: italic; min-height: 1.2em; }
    #plan {
      margin-top: 12px;
      padding: 16px;
      background: #fff;
      border: 1px solid #e2e5ea;
      border-radius: 10px;
      white-space: pre-wrap;
    }
    footer { margin-top: 20px; font-size: 0.85rem; color: #6b7280; }
  </style>
</head>
<body>
  <h1>Личный план профилактики</h1>

  <div id="banner" style="display:none">Обратитесь к врачу (103): тревожные симптомы</div>

  <form id="fh">
    <label>Возраст <input id="age" type="number" value="35" min="1" max="120" required></label>
    <label>Активность
      <select id="activity">
        <option>низкий</option><option selected>средний</option><option>высокий</option>
      </select>
    </label>
    <label><input type="checkbox" name="goal" value="движение"> движение</label>
    <label><input type="checkbox" name="goal" value="питание"> питание</label>
    <label><input type="checkbox" name="goal" value="обследования"> обследования</label>
    <label><input type="checkbox" name="goal" value="сон"> сон</label>
    <label>Жалобы и образ жизни <textarea id="notes"></textarea></label>
    <button id="go">Составить план</button>
  </form>

  <div id="status"></div>
  <div id="plan"></div>

  <footer>Материал носит образовательный характер и не является медицинской рекомендацией.</footer>

  <script>
    "use strict";
    // ═══════════════════════════════════════════════════════════════
    // ═══ LLM: ПОДКЛЮЧЕНИЕ ══════════════════════════════════════════
    // Локальный LLM на OpenAI-совместимом API, только localhost:8000.
    // Сайт сам определяет сервер по порядку ниже: сначала стандартный
    // llama.cpp (docker compose --profile llama|tiny), если его нет —
    // стенд организаторов OVMS; ни один не отвечает → понятная ошибка.
    // ═══════════════════════════════════════════════════════════════
    const SERVERS = [
      { name: "llama.cpp", BASE_URL: "http://localhost:8000/v1" },
      { name: "OVMS",      BASE_URL: "http://localhost:8000/v3" }
    ];
    let SERVER = null;

    // Пробуем серверы по очереди: /models → первый живой, model id — в рантайме.
    async function getServer() {
      if (SERVER) return SERVER;
      for (const s of SERVERS) {
        try {
          const r = await fetch(s.BASE_URL + "/models");
          if (!r.ok) continue;
          const j = await r.json();
          const id = j.data && j.data[0] && j.data[0].id;
          if (id) {
            SERVER = Object.assign({ modelName: id }, s);
            return SERVER;
          }
        } catch (err) { /* следующий сервер */ }
      }
      throw new Error("Отсутствует локальный LLM на localhost:8000 процесс llama.cpp или OVMS." +
        " Запустите docker compose --profile llama up -d (TASK.md §9).");
    }

    async function chat(messages) {
      const r = await fetch(SERVER.BASE_URL + "/chat/completions", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ model: SERVER.modelName, messages })
      });
      if (!r.ok) throw new Error("HTTP " + r.status + " (" + SERVER.name + ")");
      const data = await r.json();
      const content = data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content;
      if (!content || !content.trim()) throw new Error("Модель вернула пустой ответ, попробуйте ещё раз");
      return content;
    }

    // ═══════════════════════════════════════════════════════════════
    // ═══ LLM: ПРОМПТ ═══════════════════════════════════════════════
    // Сейчас минимальный — придумайте свой (по-русски, структурированный
    // план, без диагнозов и лекарств). Это оценивается жюри.
    // ═══════════════════════════════════════════════════════════════
    const SYSTEM_PROMPT =
      "Ты — ассистент по профилактической медицине. На основе данных пользователя составь " +
      "персональный профилактический план на русском языке. Используй структуру с четырьмя " +
      "заголовками: 'Физическая активность', 'Питание', 'Профилактические обследования', 'Режим сна'. " +
      "В каждом разделе — 2-4 коротких конкретных пункта с учётом возраста и уровня активности. " +
      "Не ставь диагнозы, не назначай лекарства и дозировки, не заменяй врача. " +
      "Если выбраны не все цели — всё равно дай краткие пункты по всем четырём разделам.";

    function buildPrompt(input) {
      // input = { age, activity, goals, notes }
      const goals = input.goals.length
        ? input.goals.join(", ")
        : "не указаны — предложи сбалансированный план по всем направлениям";
      const notes = input.notes.trim() || "не указано";
      return "Данные пользователя:\n" +
        "- Возраст: " + input.age + " лет\n" +
        "- Уровень физической активности: " + input.activity + "\n" +
        "- Приоритетные цели профилактики: " + goals + "\n" +
        "- Самочувствие и образ жизни: " + notes + "\n\n" +
        "Составь план по структуре из системной инструкции.";
    }

    // ═══════════════════════════════════════════════════════════════
    // ═══ SAFETY: RED FLAGS ═════════════════════════════════════════
    // Проверка ДО любого запроса к LLM (совпадение → совет врача).
    // Сейчас минимум — расширьте по списку из TASK.md §6.2.
    // ═══════════════════════════════════════════════════════════════
    const RED_FLAGS = [
      /боль\s+в\s+груд[иье]/i,
      /одышк/i,
      /кровотечен/i,
      /потер[яи]\s+сознан|без\s+сознания|сознание\s+потер/i,
      /суицид|покончить\s+с\s+собой|не\s+хочу\s+жить|убить\s+себя/i,
      /температур[а-я]*\D{0,15}(39|4\d)([.,]\d)?/i,
      /остр(ая|ой|ую)\s+боль\s+в\s+живот/i,
      /асимметри[яи]\s+лиц/i,
      /онемени[ея]\s+(лиц|рук|ног)/i,
      /расстройств[оа]\s+реч|язык\s+заплетается|не\s+могу\s+говорить/i
    ];
    function isRedFlag(text) {
      return RED_FLAGS.some(re => re.test(text)); // TODO: расширьте список выше
    }

    // ═══════════════ UI (минимум — сделайте свой) ══════════════════
    const $ = id => document.getElementById(id);

    $("fh").addEventListener("submit", async ev => {
      ev.preventDefault();
      const input = {
        age: $("age").value,
        activity: $("activity").value,
        goals: [...document.querySelectorAll("input[name=goal]:checked")].map(el => el.value),
        notes: $("notes").value
      };

      // red flags — до обращения к модели:
      if (isRedFlag(input.notes)) {
        $("banner").style.display = "block";
        return;
      }
      $("banner").style.display = "none";
      $("plan").textContent = "";
      $("go").disabled = true;
      $("status").textContent = "Ждём локальную модель — это может занять десятки секунд…";

      try {
        await getServer(); // llama.cpp → OVMS → ошибка
        const reply = await chat([
          { role: "system", content: SYSTEM_PROMPT },
          { role: "user", content: buildPrompt(input) }
        ]);
        $("plan").textContent = reply;
        $("status").textContent = "Модель: " + SERVER.modelName + " (" + SERVER.name + ")";
      } catch (err) {
        $("status").textContent = "Ошибка: " + err.message;
      } finally {
        $("go").disabled = false;
      }
    });
  </script>
</body>
</html>
